name: Swiggy
description: 'Swiggy is an Indian hyperlocal on-demand commerce and food-delivery
  platform founded in 2014 and headquartered in Bengaluru. Through a single consumer
  app it connects users with restaurant and merchant partners for food delivery,
  Swiggy Instamart (quick grocery and essentials commerce), Swiggy Genie (pick-up
  and drop errands), Swiggy Dineout (restaurant reservations and dining), and the
  Swiggy One membership program, operating across hundreds of cities in India with
  a large network of restaurant and delivery partners. Swiggy is a publicly listed
  company backed by Accel, Bessemer Venture Partners, Norwest Venture Partners and
  SoftBank Vision Fund. It exposes a login-gated merchant partner portal but does
  not publish a public developer API program.'
